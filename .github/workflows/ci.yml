name: Build

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AI-Meeting-main
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: |
            AI-Meeting-main/pom.xml
            AI-Meeting-main/admin/pom.xml
      - name: Build backend
        run: |
          chmod +x ./mvnw
          ./mvnw -B -ntp clean package -Dmaven.test.skip=true

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AI-Meeting-Frontend-main
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: AI-Meeting-Frontend-main/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check and build frontend
        run: |
          npm run check
          npm run build

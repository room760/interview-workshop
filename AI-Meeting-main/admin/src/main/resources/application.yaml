server:
  port: ${SERVER_PORT:8002}

spring:
  application:
    name: interview-workshop-agent-admin
  config:
    import: optional:classpath:interview-followup-rule.yaml
  profiles:
    include: satoken,sse
  servlet:
    multipart:
      location: ${INTERVIEW_WORKSHOP_MULTIPART_TEMP_DIR:${interview-workshop-agent.storage.upload-temp-dir}}
      max-file-size: 100MB
      max-request-size: 100MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:interview_workshop}?useUnicode=true&characterEncoding=UTF-8&rewriteBatchedStatements=true&allowMultiQueries=true&serverTimezone=${APP_TIMEZONE:Asia/Shanghai}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:123456}
  data:
    mongodb:
      host: ${MONGODB_HOST:127.0.0.1}
      port: ${MONGODB_PORT:27017}
      database: ${MONGODB_DATABASE:interview_workshop_agent}
      # username: ${MONGODB_USERNAME:}
      # password: ${MONGODB_PASSWORD:}
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
        shutdown-timeout: 100ms
      timeout: 10000ms
  task:
    scheduling:
      pool:
        size: 2
      thread-name-prefix: redis-session-task-
    execution:
      pool:
        core-size: 4
        max-size: 8
        queue-capacity: 100
        thread-name-prefix: redis-session-async-
  ai:
    model:
      chat: none
    openai:
      # Spring AI 使用兼容协议访问讯飞 Embedding；此处不会连接 OpenAI 服务。
      api-key: ${XUNFEI_EMBEDDING_API_KEY:not-configured}
      base-url: ${XUNFEI_EMBEDDING_BASE_URL:https://maas-api.cn-huabei-1.xf-yun.com}
      embedding:
        embeddings-path: ${XUNFEI_EMBEDDING_PATH:/v2/embeddings}
        options:
          model: ${XUNFEI_EMBEDDING_MODEL_ID:not-configured}
    mcp:
      server:
        enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    defaults:
      enabled: true

logging:
  file:
    path: ${INTERVIEW_WORKSHOP_LOG_DIR:${interview-workshop-agent.storage.log-dir}}

collection:
  vector:
    similarity-threshold: 0.9

xunfei:
  lat-key:
    app-id: ${XUNFEI_APP_ID:}
    api-key: ${XUNFEI_API_KEY:}
    api-secret: ${XUNFEI_API_SECRET:}
    rta-api-key: ${XUNFEI_RTA_API_KEY:}

interview-workshop-agent:
  rag:
    hybrid:
      enabled: ${RAG_HYBRID_ENABLED:true}
      fallback-to-vector: ${RAG_FALLBACK_TO_VECTOR:true}
      rerank-enabled: ${RAG_RERANK_ENABLED:true}
      chunk-size: ${RAG_CHUNK_SIZE:400}
      chunk-overlap: ${RAG_CHUNK_OVERLAP:60}
      candidate-limit: ${RAG_CANDIDATE_LIMIT:20}
      rerank-limit: ${RAG_RERANK_LIMIT:15}
      rerank-timeout-millis: ${RAG_RERANK_TIMEOUT_MILLIS:100}
      rrf-k: ${RAG_RRF_K:60}
      top-k: ${RAG_TOP_K:5}
      index-path: ${RAG_LUCENE_PATH:${user.home}/.interview-workshop-agent/rag-lucene}
    pgvector:
      jdbc-url: ${PGVECTOR_JDBC_URL:jdbc:postgresql://127.0.0.1:5433/aimeeting_vector}
      username: ${PGVECTOR_USERNAME:aimeeting}
      password: ${PGVECTOR_PASSWORD:local_dev_only_change_me}
      dimensions: ${PGVECTOR_DIMENSIONS:1536}
      table-name: ${PGVECTOR_TABLE_NAME:job_knowledge_vector}
  security:
    require-xunfei-secrets: ${REQUIRE_XUNFEI_SECRETS:false}
  storage:
    base-dir: ${INTERVIEW_WORKSHOP_STORAGE_BASE_DIR:${user.home}/.interview-workshop-agent}
    upload-temp-dir: ${INTERVIEW_WORKSHOP_MULTIPART_TEMP_DIR:${interview-workshop-agent.storage.base-dir}/temp/upload}
    audio-temp-dir: ${INTERVIEW_WORKSHOP_AUDIO_TEMP_DIR:${interview-workshop-agent.storage.base-dir}/temp/audio}
    log-dir: ${INTERVIEW_WORKSHOP_LOG_DIR:${interview-workshop-agent.storage.base-dir}/logs}
  thread-pool:
    general:
      core-pool-size: 50
      max-pool-size: 200
      queue-capacity: 1000
      keep-alive-seconds: 300
      thread-name-prefix: interview-workshop-async-
    agent:
      core-pool-size: 8
      max-pool-size: 32
      queue-capacity: 100
      keep-alive-seconds: 60
      thread-name-prefix: interview-workshop-agent-
    ai-io:
      core-pool-size: 24
      max-pool-size: 64
      queue-capacity: 400
      keep-alive-seconds: 120
      thread-name-prefix: interview-workshop-ai-io-
    cpu:
      core-pool-size: 8
      max-pool-size: 16
      queue-capacity: 256
      keep-alive-seconds: 60
      thread-name-prefix: interview-workshop-cpu-
    query:
      core-pool-size: 16
      max-pool-size: 48
      queue-capacity: 600
      keep-alive-seconds: 120
      thread-name-prefix: interview-workshop-query-
    scheduled-pool-size: 8
    scheduled-thread-name-prefix: interview-workshop-schedule-
  agent-binding:
    general-agent-chat: ${INTERVIEW_WORKSHOP_AGENT_GENERAL_CHAT:通用智能体}
    interview-question-extraction: ${INTERVIEW_WORKSHOP_AGENT_INTERVIEW_QUESTION_EXTRACTION:面试出题官}
    interview-answer-evaluation: ${INTERVIEW_WORKSHOP_AGENT_INTERVIEW_ANSWER_EVALUATION:用户答案评分官}
    interview-job-match: ${INTERVIEW_WORKSHOP_AGENT_INTERVIEW_JOB_MATCH:企业匹配度评分官}
    interview-demeanor: ${INTERVIEW_WORKSHOP_AGENT_INTERVIEW_DEMEANOR:神态分析官}
    interview-question-asking: ${INTERVIEW_WORKSHOP_AGENT_INTERVIEW_QUESTION_ASKING:面试提问官}
    assistant-intent-routing: ${INTERVIEW_WORKSHOP_AGENT_INTENT_ROUTING:用户意图路由官}
    job-preparation: ${INTERVIEW_WORKSHOP_AGENT_JOB_PREPARATION:岗位备战规划官}
  flow-limit:
    enable: true
    time-window-seconds: 1
    max-access-count: 20
    requested-tokens: 1
    interview-answer-time-window-seconds: 1
    interview-answer-max-access-count: 8
    interview-heavy-time-window-seconds: 1
    interview-heavy-max-access-count: 2
    interview-read-time-window-seconds: 1
    interview-read-max-access-count: 15
    interview-ai-call-time-window-seconds: 1
    interview-ai-call-max-access-count: 6
  ai-guard:
    enable: true
    circuit-sliding-window-size: 50
    circuit-failure-rate-threshold: 50
    circuit-permitted-calls-in-half-open-state: 10
    circuit-open-state-wait-millis: 30000
    executor-threads: 32
    stages:
      interview-evaluation:
        timeout-millis: 20000
        max-concurrent-calls: 30
        retry-count: 1
        retry-wait-millis: 100
      interview-followup:
        timeout-millis: 20000
        max-concurrent-calls: 20
        retry-count: 1
        retry-wait-millis: 100
      interview-extraction:
        timeout-millis: 60000
        max-concurrent-calls: 8
        retry-count: 0
        retry-wait-millis: 0
      interview-demeanor:
        timeout-millis: 20000
        max-concurrent-calls: 6
        retry-count: 0
        retry-wait-millis: 0
  ai-singleflight:
    enable: true
    mode: hybrid
    distributed-enabled: true
    ttl-millis: 65000
    wait-timeout-millis: 65000
    stream-block-timeout-millis: 3000
    poll-fallback-interval-millis: 2000
    follower-max-wait-millis: 20000
    l1-cache-max-size: 1000
    cleanup-threshold: 256
    heavy-lock-expire-seconds: 90
    heavy-lock-wait-millis: 0
    stage-policies:
      interview-evaluation:
        heartbeat-interval-millis: 3000
        running-ttl-millis: 15000
        takeover-detect-millis: 10000
        result-ttl-millis: 600000
        failed-result-ttl-millis: 60000
        compression-threshold-bytes: 4096
        compression-codec: gzip
        l1-cache-enabled: true
        l1-cache-ttl-millis: 30000
      interview-followup:
        heartbeat-interval-millis: 2500
        running-ttl-millis: 12000
        takeover-detect-millis: 8000
        result-ttl-millis: 180000
        failed-result-ttl-millis: 30000
        compression-threshold-bytes: 2048
        compression-codec: gzip
        l1-cache-enabled: true
        l1-cache-ttl-millis: 15000
      interview-extraction:
        heartbeat-interval-millis: 4000
        running-ttl-millis: 20000
        takeover-detect-millis: 12000
        result-ttl-millis: 1800000
        failed-result-ttl-millis: 60000
        compression-threshold-bytes: 1024
        compression-codec: gzip
        l1-cache-enabled: true
        l1-cache-ttl-millis: 60000
      interview-demeanor:
        heartbeat-interval-millis: 5000
        running-ttl-millis: 30000
        takeover-detect-millis: 15000
        result-ttl-millis: 900000
        failed-result-ttl-millis: 60000
        compression-threshold-bytes: 2048
        compression-codec: gzip
        l1-cache-enabled: false
  interview:
    answer-guard:
      lock-expire-seconds: -1
      lock-watchdog-enabled: true
      processing-expire-seconds: 120
      processing-long-tail-expire-seconds: 300
      replay-expire-hours: 24
      lock-wait-millis: 0
    turn-repair:
      enable: true
      fixed-delay-millis: 3000
      batch-size: 50
      max-retries: 6
  redis-session:
    enable: true
    message-expire-seconds: 604800
    sync-delay-seconds: 30
    batch-sync-size: 100
    max-queue-size: 10000
    clean-interval-seconds: 300
  tool-calling:
    model-modes:
      "3": FALLBACK
      "4": NATIVE
    job-match-ai-properties-id: ${JOB_MATCH_TOOL_CALLING_AI_ID:4}
  job-posting-search:
    api-password: ${XUNFEI_WANSOU_API_PASSWORD:}
    base-url: https://search-api-open.cn-huabei-1.xf-yun.com
    max-results: 5
    timeout-seconds: 10
